<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tik tak</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <div class="title">
        <div class="barrenav">
            <h1>Jeux Tik Tak Toe </h1>
            <div class="mode1" id="mode">
                <span  id="mode2" onclick="sombre()"></span> 
                <span  id="mode3"  onclick="clair()"></span> 
            </div> 
        </div>
        <p><span class="lien" ><a href="aide.html" target="_blank">Aide</a></span></p>
        <div class="form">
            <div class="input_name1">
                <label for="">Joueur1</label>
                <input type="text" id="name_player1" placeholder="Nom de joueur1">
            </div>
            <div class="input_name1">
                <label for="">joueur2</label>
                <input type="text" id="name_player2" placeholder="Nom de joueur2">
            </div>
        </div>
        <div class="choix">
            <p class="btn_choix">Choisir un Bouton</p>
            <input type="submit" id="chose" class="choix_btn" onclick="choix()" value="O">
            <input type="submit" id="chose2" class="choix_btn" onclick="choix2()" value="X">
        </div>
        <div class="btn">
            <button id="commencer"  onclick="commencer()">Commencer</button>
            <button id="recommencer"  onclick="recommencer()">Recommencer</button>
            <button id="continuer"  onclick="continuer()">Continuer</button>
        </div>
        <div id="player_name">
        </div>
    </div>
    <div class="grid">
        <div id="case1" onclick="valeur1()" class="tab"></div>
        <div id="case2" onclick="valeur2()"  class="tab"></div>
        <div id="case3" onclick="valeur3()"  class="tab"></div>
        <div id="case4" onclick="valeur4()"  class="tab"></div>
        <div id="case5" onclick="valeur5()" class="tab"></div>
        <div id="case6" onclick="valeur6()" class="tab"></div>
        <div id="case7" onclick="valeur7()" class="tab"></div>
        <div id="case8" onclick="valeur8()" class="tab"></div>
        <div id="case9" onclick="valeur9()" class="tab"></div>
    </div>
    <div class="foot">
        <p>Score de <span id="player1"></span> : <span id="deb_score1">0</span>  </p>
        <p>Score de <span id="player2"></span> : <span id="deb_score2">0</span> </p>
    </div>
    
</body>
</html>
